name: Build RRBPREP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build RRBPREP Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="RRBPREP-Mobile-Swipe-Fit-Dashboard-Updated-Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Project ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if { [ -f "$dir/settings.gradle" ] || \
                 [ -f "$dir/settings.gradle.kts" ]; } && \
               { [ -f "$dir/app/build.gradle" ] || \
                 [ -f "$dir/app/build.gradle.kts" ]; }; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find extracted -type f \( \
              -name settings.gradle -o \
              -name settings.gradle.kts \
            \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project files were not found."
            find extracted -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          set -e

          APK_PATH="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK_PATH"

      - name: Upload RRBPREP APK
        uses: actions/upload-artifact@v4
        with:
          name: RRBPREP-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
