name: Build RRBPREP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Configure Android SDK
      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          if [ ! -d "$SDK/cmdline-tools" ]; then
            echo "ERROR: Android SDK command-line tools are missing."
            exit 1
          fi

      # 4. Install required Android packages
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            exit 1
          fi

          echo "Using: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Extract the Android project
      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="RRBPREP-Mobile-Swipe-Fit-Dashboard-Updated-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -iname "*.zip"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No settings.gradle file found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      # 6. Install Gradle 8.9
      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          VERSION="8.9"
          INSTALL_DIR="$RUNNER_TEMP/gradle-$VERSION"
          ZIP_FILE="$RUNNER_TEMP/gradle-$VERSION-bin.zip"
          EXTRACT_DIR="$RUNNER_TEMP/gradle-extract"

          if [ ! -x "$INSTALL_DIR/bin/gradle" ]; then
            curl -fL \
              "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
              -o "$ZIP_FILE"

            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"

            unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

            if [ ! -x "$EXTRACT_DIR/gradle-${VERSION}/bin/gradle" ]; then
              echo "ERROR: Gradle extraction failed."
              exit 1
            fi

            mkdir -p "$INSTALL_DIR"

            cp -a "$EXTRACT_DIR/gradle-${VERSION}/." "$INSTALL_DIR/"
          fi

          echo "$INSTALL_DIR/bin" >> "$GITHUB_PATH"

          "$INSTALL_DIR/bin/gradle" --version

      # 7. Build the debug APK
      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting Android build..."

          gradle --no-daemon --stacktrace assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          echo "SUCCESS: APK generated at $APK"

      # 8. Upload the APK
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RRBPREP-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
