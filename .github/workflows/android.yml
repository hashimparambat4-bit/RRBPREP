name: Build RRBPREP Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RRBPREP-Mobile-Swipe-Fit-Dashboard-Updated-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            echo "ZIP files in repository:"
            find . -maxdepth 3 -type f -iname "*.zip"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android app Gradle file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Gradle 8.9
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.9"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl -fL \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$RUNNER_TEMP/gradle.zip"

            mkdir -p "$RUNNER_TEMP/gradle-unpack"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/gradle-unpack"
            mv "$RUNNER_TEMP/gradle-unpack/gradle-${GRADLE_VERSION}" "$GRADLE_HOME"
          fi

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"
          "$GRADLE_HOME/bin/gradle" --version

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

          echo "Checking for generated APK..."
          find app/build/outputs/apk -type f -name "*.apk"

          if [ ! -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RRBPREP-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
