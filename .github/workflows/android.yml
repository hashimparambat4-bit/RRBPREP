name: Extract RRBPREP Repository ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Check ZIP file
        run: |
          ZIP="RRBPREP-Repository-Upload.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository root."
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -iname "*.zip"
            exit 1
          fi

          echo "Found $ZIP"

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p /tmp/rrbprep-extract
          unzip -o "RRBPREP-Repository-Upload.zip" \
            -d /tmp/rrbprep-extract

          echo "ZIP extraction completed."

      - name: Copy project files
        run: |
          set -e

          cp -an /tmp/rrbprep-extract/. .

          echo "Project files copied."
          find . -maxdepth 3 -type f | head -100

      - name: Save extracted files to GitHub
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No new changes to save."
          else
            git commit -m "Extract RRBPREP repository ZIP"
            git push
          fi
