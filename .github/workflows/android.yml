name: Build RRBPREP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Extract and Build RRBPREP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="RRBPREP-MockTest-Back-Setup-Fixed-Android-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extraction completed."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/settings.gradle" ] || \
               [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find extracted -type f \( \
              -name settings.gradle -o \
              -name settings.gradle.kts \
            \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle was not found."
            find extracted -maxdepth 6 -type f | head -150
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle build file was not found."
            exit 1
          fi

      - name: Check existing Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: No configured Android SDK found on this runner."
            echo "This workflow does not install or change the SDK."
            exit 1
          fi

          echo "Using existing Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -d "$SDK/platforms" ]; then
            echo "Installed Android platforms:"
            ls "$SDK/platforms"
          else
            echo "WARNING: Android platforms directory is missing."
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            gradle --no-daemon assembleDebug
          else
            echo "ERROR: Gradle wrapper and system Gradle are both missing."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RRBPREP-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
