name: Build RRBPREP APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository files
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Extract the project ZIP
      - name: Extract RRBPREP project
        shell: bash
        run: |
          set -e

          ZIP_FILE="RRBPREP-MockTest-Back-Setup-Fixed-Android-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found."
            echo "Expected filename: $ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Project ZIP extracted successfully."

      # Step 4: Locate the Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/gradlew" ] && \
               { [ -f "$dir/settings.gradle" ] || \
                 [ -f "$dir/settings.gradle.kts" ]; }; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find extracted -type f \
              -name settings.gradle -o \
              -name settings.gradle.kts \
           
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project or Gradle wrapper not found."
            echo "Extracted project files:"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      # Step 5: Use the existing Android SDK
      # No Android SDK installation or version changes
      - name: Check existing Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner."
            exit 1
          fi

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory does not exist: $ANDROID_HOME"
            exit 1
          fi

          echo "Android SDK: $ANDROID_HOME"
          echo "Installed SDK components:"
          ls -la "$ANDROID_HOME"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi

      # Step 6: Build the debug APK
      - name: Build RRBPREP debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          ./gradlew --no-daemon assembleDebug

      # Step 7: Find the generated APK
      - name: Locate generated
